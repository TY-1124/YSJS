<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易交互网页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 40px 20px;
            background-color: #f5f7fa;
            transition: background 0.4s;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .item {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin:4px;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #2563eb;
            color:white;
        }
        .btn-primary:hover {
            background-color:#1d4ed8;
        }
        .btn-green {
            background-color:#10b981;
            color:white;
        }
        .btn-orange {
            background-color:#f97316;
            color:white;
        }
        .count-box {
            font-size:28px;
            text-align:center;
            margin:12px 0;
            font-weight:bold;
        }
        .output {
            margin-top:10px;
            padding:12px;
            background:#f3f4f6;
            border-radius:8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>简易交互演示</h1>

    <!-- 计数器 -->
    <div class="item">
        <label>计数器</label>
        <div class="count-box" id="counter">0</div>
        <button class="btn-primary" onclick="add()">+ 加一</button>
        <button class="btn-orange" onclick="sub()">- 减一</button>
        <button onclick="resetCount()">重置</button>
    </div>

    <!-- 输入框交互 -->
    <div class="item">
        <label>输入文字，点击显示</label>
        <input type="text" id="textInput" placeholder="在这里输入内容">
        <button class="btn-green" onclick="showText()">展示输入内容</button>
        <div class="output" id="textOutput"></div>
    </div>

    <!-- 修改背景色 -->
    <div class="item">
        <label>切换页面背景颜色</label>
        <button class="btn-primary" onclick="changeBg('#e0f2fe')">浅蓝</button>
        <button class="btn-green" onclick="changeBg('#dcfce7')">浅绿</button>
        <button class="btn-orange" onclick="changeBg('#fff7ed')">浅橙</button>
        <button onclick="changeBg('#f5f7fa')">恢复默认</button>
    </div>

    <!-- 弹窗 -->
    <div class="item">
        <button class="btn-primary" onclick="showAlert()">弹出提示框</button>
    </div>
</div>

<script>
    //计数器
    let count = 0;
    const counterDom = document.getElementById('counter');
    function add(){
        count++;
        counterDom.innerText = count;
    }
    function sub(){
        count--;
        counterDom.innerText = count;
    }
    function resetCount(){
        count = 0;
        counterDom.innerText = count;
    }

    //输入文字展示
    function showText(){
        const inputVal = document.getElementById('textInput').value;
        document.getElementById('textOutput').innerText = `你输入的：${inputVal}`;
    }

    //修改背景
    function changeBg(color){
        document.body.style.backgroundColor = color;
    }

    //弹窗
    function showAlert(){
        alert("这是网页交互弹窗！");
    }
</script>
</body>
</html>
